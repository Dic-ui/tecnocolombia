<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tickets | TecnoColombia</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
    <div class="logo">TecnoColombia S.A.S</div>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="sla.html">SLA</a></li>
            <li><a href="seguridad.html">Seguridad</a></li>
            <li><a href="tickets.html">Tickets</a></li>
        </ul>
    </nav>
</header>

<section class="hero-small">
    <h1>Sistema de Gestión de Tickets</h1>
    <p>Registro y seguimiento de incidentes TI.</p>
</section>

<section class="contenedor-formulario">
    <div class="card-ticket">
        <h2>Registrar Ticket</h2>

        <form id="ticketForm">
            <input type="text" id="usuario" placeholder="Nombre del usuario" required>
            <input type="email" id="correo" placeholder="Correo electrónico" required>

            <select id="categoria" required>
                <option value="">Seleccione categoría</option>
                <option>CRM</option>
                <option>Correo Corporativo</option>
                <option>Conectividad</option>
                <option>Hardware</option>
                <option>Contraseñas</option>
            </select>

            <select id="prioridad" required>
                <option value="">Seleccione prioridad</option>
                <option>Crítica</option>
                <option>Alta</option>
                <option>Media</option>
                <option>Baja</option>
            </select>

            <textarea id="descripcion" rows="5" placeholder="Descripción del incidente" required></textarea>

            <button type="submit">Crear Ticket</button>
        </form>
    </div>
</section>

<section class="tabla-tickets">
    <h2>Tickets Registrados</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Categoría</th>
                <th>Prioridad</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="listaTickets"></tbody>
    </table>
</section>

<footer>
    <p>© 2026 TecnoColombia S.A.S - Mesa de Servicios TI</p>
</footer>

<script src="js/tickets.js"></script>
</body>
</html>
